steps:
  - label: ":mac: Fast compiler checks"
    key: fast-macos
    if: 'build.tag == null && build.branch !~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: .buildkite/scripts/fast-check.sh
    agents:
      queue: macos-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  # Optional cross-platform quick checks. A PR label or a manual build with
  # CYNA_FAST_PLATFORMS selects them without pausing macOS-only builds.
  - label: ":linux: Fast compiler checks (optional)"
    key: fast-linux
    if: 'build.tag == null && build.branch !~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/ && (build.env("CYNA_FAST_PLATFORMS") =~ /linux/ || build.pull_request.labels includes "ci:linux" || build.pull_request.labels includes "ci:cross-platform")'
    command: .buildkite/scripts/fast-check.sh linux
    agents:
      queue: linux-local-gpu
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - label: ":windows: Fast compiler checks (optional)"
    key: fast-windows
    if: 'build.tag == null && build.branch !~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/ && (build.env("CYNA_FAST_PLATFORMS") =~ /windows/ || build.pull_request.labels includes "ci:windows" || build.pull_request.labels includes "ci:cross-platform")'
    command: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/scripts/windows-fast-check.ps1"
    agents:
      queue: windows-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - label: ":bookmark: Detect merged release"
    key: detect-merged-release
    if: 'build.tag == null && build.branch == "master"'
    command: /opt/homebrew/bin/python3.13 .buildkite/scripts/detect-merged-release.py
    agents:
      queue: macos-local

  - label: ":bookmark: Check release candidate version"
    key: candidate-version
    if: 'build.tag == null && build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: .buildkite/scripts/candidate-version.sh
    agents:
      queue: macos-local

  - wait: ~

  - label: ":mac: Verify macOS candidate"
    key: verify-macos
    if: 'build.tag == null && (build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/)'
    command: |
      set -e
      .buildkite/scripts/runner-ready.sh macos --from-buildkite
      .buildkite/scripts/release-verify.sh macos build
      .buildkite/scripts/release-verify.sh macos package
    agents:
      queue: macos-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN
  - label: ":linux: Verify Linux candidate"
    key: verify-linux
    if: 'build.tag == null && (build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/)'
    command: |
      set -e
      .buildkite/scripts/runner-ready.sh linux --from-buildkite
      .buildkite/scripts/release-verify.sh linux build
      .buildkite/scripts/release-verify.sh linux package
    agents:
      queue: linux-local-gpu
    secrets:
      - PRIVATE_REPO_READ_TOKEN
  - label: ":windows: Verify Windows candidate"
    key: verify-windows
    if: 'build.tag == null && (build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/)'
    command: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/scripts/windows-release-stages.ps1"
    agents:
      queue: windows-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - wait: ~

  - label: ":package: Check candidate archives"
    key: candidate-artifacts
    if: 'build.tag == null && (build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/)'
    command: /opt/homebrew/bin/python3.13 .buildkite/scripts/collect-candidate.py
    agents:
      queue: macos-local
